ndgaan."], ["8", "Wat is de functie van een default route?", ["Alle lokale MAC-adressen bewaren", "Een switchnaam instellen", "Een DNS-naam vertalen", "Een route bieden als geen specifiekere route past"], 3, "De default route is een vangnet wanneer geen specifiekere passende route bestaat."], ["9", "Hoe wordt een ARP request normaal verzonden?", ["Als broadcast", "Als unicast naar een bekende MAC", "Via alle routers op internet", "Als DNS-aanvraag"], 0, "Een ARP request wordt op het lokale Ethernet als broadcast verstuurd."], ["9", "Welk bericht geeft bij IPv6 een antwoord op een Neighbor Solicitation?", ["ARP reply", "Neighbor Advertisement", "Router Solicitation", "DHCP Discover"], 1, "Een Neighbor Advertisement kan het MAC-adres van de gevraagde buur meedelen."], ["9", "Welk MAC-adres zoekt een host voor een externe bestemming?", ["Dat van de externe host rechtstreeks", "Dat van elke router", "Dat van de default gateway", "Dat van zichzelf"], 2, "De host stuurt het eerste frame naar de gateway, die op het lokale netwerk bereikbaar is."], ["9", "Welke berichten helpen IPv6 hosts routers ontdekken?", ["ARP request en ARP reply", "HTTP en FTP", "TCP en UDP", "Router Solicitation en Router Advertisement"], 3, "Router Solicitation en Router Advertisement zijn ICMPv6 Neighbor Discovery berichten voor routerontdekking."]]);const modules=[{"title": "Module 1  Networking Today", "parts": [{"heading": true, "text": "Netwerken en apparaten"}, {"heading": false, "text": "Een netwerk verbindt apparaten zodat ze gegevens en diensten kunnen delen."}, {"heading": false, "text": "Eindapparaten (hosts) zijn bijvoorbeeld pc’s, telefoons en servers."}, {"heading": false, "text": "Tussenliggende apparaten sturen verkeer door: een switch verbindt apparaten binnen een LAN, een router verbindt verschillende netwerken en een access point geeft draadloze toegang."}, {"heading": true, "text": "LAN, WAN en internet"}, {"heading": false, "text": "Een LAN beslaat een beperkt gebied, zoals een woning of school."}, {"heading": false, "text": "Een WAN verbindt netwerken over grotere afstanden."}, {"heading": false, "text": "Het internet is een wereldwijd netwerk van onderling verbonden netwerken."}, {"heading": false, "text": "Een ISP levert toegang tot internet."}, {"heading": false, "text": "Een intranet is een privénetwerk voor een organisatie; een extranet geeft ook geselecteerde buitenstaanders toegang."}, {"heading": true, "text": "Topologie en verbindingen"}, {"heading": false, "text": "Een fysieke topologie toont apparaten en kabels; een logische topologie toont hoe gegevens door het netwerk bewegen."}, {"heading": false, "text": "Verbindingen kunnen onder meer via koper, glasvezel of draadloos lopen."}, {"heading": false, "text": "Thuisverbindingen omvatten bijvoorbeeld kabel, DSL, glasvezel en mobiel internet."}, {"heading": true, "text": "Betrouwbaarheid en veiligheid"}, {"heading": false, "text": "Een goed netwerk biedt fouttolerantie (bijvoorbeeld een alternatief pad), schaalbaarheid, Quality of Service (voorrang voor belangrijk verkeer) en beveiliging."}, {"heading": false, "text": "Beveiliging beschermt vertrouwelijkheid, integriteit en beschikbaarheid."}, {"heading": false, "text": "Voorbeelden zijn sterke wachtwoorden, updates, firewalls en toegangscontrole."}, {"heading": true, "text": "Trends"}, {"heading": false, "text": "BYOD betekent dat mensen eigen apparaten gebruiken."}, {"heading": false, "text": "Cloud computing levert diensten via een netwerk."}, {"heading": false, "text": "Online samenwerken en video stellen eisen aan capaciteit, vertraging en beveiliging."}, {"heading": true, "text": "Voorbeeld stap voor stap"}, {"heading": false, "text": "In een school vormen computers en printers samen een LAN."}, {"heading": false, "text": "De switch verbindt ze."}, {"heading": false, "text": "De router verbindt dit schoolnetwerk met internet."}]}, {"title": "Module 2  Basic Switch and End Device Configuration", "parts": [{"heading": true, "text": "Cisco IOS en toegang"}, {"heading": false, "text": "Cisco IOS is de besturingssoftware op veel netwerkapparaten."}, {"heading": false, "text": "Je kunt een apparaat lokaal via een consolepoort beheren of op afstand via SSH."}, {"heading": false, "text": "De CLI werkt met opdrachten en verschillende modi."}, {"heading": false, "text": "In user EXEC zie je prompt Switch>; met enable ga je naar privileged EXEC: Switch#."}, {"heading": false, "text": "Met configure terminal ga je naar de globale configuratie: Switch(config)#."}, {"heading": true, "text": "Een basisconfiguratie"}, {"heading": false, "text": "Een hostname geeft het apparaat een herkenbare naam."}, {"heading": false, "text": "Beveilig privileged EXEC met enable secret en configureer console- en VTY-toegang met passende wachtwoorden."}, {"heading": false, "text": "Een waarschuwingstekst kan met banner motd worden ingesteld. service password-encryption verbergt eenvoudige wachtwoorden in de configuratie, maar is geen sterke versleuteling."}, {"heading": true, "text": "Configuratie opslaan"}, {"heading": false, "text": "De running-config staat in RAM en is actief."}, {"heading": false, "text": "De startup-config staat in NVRAM en wordt bij het opstarten geladen."}, {"heading": false, "text": "Met copy running-config startup-config sla je de actieve configuratie op."}, {"heading": false, "text": "Gebruik show running-config om haar te bekijken."}, {"heading": true, "text": "Beheeradres en eindapparaat"}, {"heading": false, "text": "Een switch op laag 2 krijgt voor beheer een IP-adres op een SVI, bijvoorbeeld interface vlan 1; dit adres wordt niet gebruikt om gewone Ethernetframes te schakelen."}, {"heading": false, "text": "Stel een default gateway in voor beheer vanuit een ander netwerk."}, {"heading": false, "text": "Een pc heeft een IP-adres, subnetmasker en eventueel een standaardgateway en DNS-server nodig. ping test bereikbaarheid, maar een mislukte ping kan ook door filtering komen."}, {"heading": true, "text": "Voorbeeld van opdrachten"}, {"heading": false, "text": "enable → configure terminal → hostname S1 → enable secret SterkWachtwoord → interface vlan 1 → ip address 192.168.1.2 255.255.255.0 → no shutdown → exit → ip default-gateway 192.168.1.1 → end → copy running-config startup-config."}, {"heading": false, "text": "Gebruik in de praktijk eigen sterke wachtwoorden en beveiligde toegang."}, {"heading": true, "text": "Voorbeeld stap voor stap"}, {"heading": false, "text": "Je verandert de naam van een switch naar S1."}, {"heading": false, "text": "Zonder opslaan kan die naam na een herstart verdwijnen."}, {"heading": false, "text": "Met copy running-config startup-config bewaar je de wijziging."}]}, {"title": "Module 3  Protocols and Models", "parts": [{"heading": true, "text": "Protocollen"}, {"heading": false, "text": "Een protocol beschrijft afspraken over communicatie, zoals het formaat, de timing en de verwerking van berichten."}, {"heading": false, "text": "Ethernet, IP, TCP en HTTP werken samen in een protocolsuite."}, {"heading": false, "text": "Standaardorganisaties zoals IEEE en IETF bevorderen samenwerking tussen producten van verschillende fabrikanten."}, {"heading": true, "text": "OSI en TCP IP"}, {"heading": false, "text": "Het OSI-model heeft zeven lagen: 7 applicatie, 6 presentatie, 5 sessie, 4 transport, 3 netwerk, 2 datalink en 1 fysiek."}, {"heading": false, "text": "Het TCP/IP-model gebruikt meestal vier lagen: application, transport, internet en network access."}, {"heading": false, "text": "De modellen helpen problemen per functie te begrijpen."}, {"heading": true, "text": "Encapsulatie"}, {"heading": false, "text": "Bij verzending voegt elke laag eigen informatie toe."}, {"heading": false, "text": "Applicatiegegevens worden een segment (TCP) of datagram (UDP), vervolgens een IP-pakket, een frame en uiteindelijk bits op het medium."}, {"heading": false, "text": "Aan de ontvangende kant worden de lagen in omgekeerde volgorde verwerkt: decapsulatie."}, {"heading": true, "text": "Adressen en communicatie"}, {"heading": false, "text": "Een IP-adres identificeert de bron en bestemming op netwerklaag 3."}, {"heading": false, "text": "MAC-adressen werken op de lokale verbinding op laag 2."}, {"heading": false, "text": "Unicast is één-op-één, multicast bereikt een groep en broadcast bereikt alle hosts binnen een lokaal IPv4-broadcastdomein."}, {"heading": true, "text": "Voorbeeld stap voor stap"}, {"heading": false, "text": "Je opent een website: HTTP beschrijft de aanvraag, TCP verzorgt het transport, IP bepaalt de bestemming en Ethernet vervoert het frame op de lokale verbinding."}]}, {"title": "Module 4  Physical Layer", "parts": [{"heading": true, "text": "Wat doet de fysieke laag"}, {"heading": false, "text": "De fysieke laag transporteert bits als elektrische, licht- of radiosignalen."}, {"heading": false, "text": "Ze beschrijft onder andere connectoren, media, signaalcodering en timing."}, {"heading": false, "text": "Bandbreedte is de theoretische capaciteit; throughput is de werkelijk behaalde gegevensoverdracht."}, {"heading": false, "text": "Latentie is de vertraging."}, {"heading": true, "text": "Koper"}, {"heading": false, "text": "UTP bestaat uit getwiste draadparen; de twisting vermindert overspraak."}, {"heading": false, "text": "STP voegt afscherming toe."}, {"heading": false, "text": "Koper kan last hebben van elektromagnetische storing en heeft afstandsgrenzen."}, {"heading": false, "text": "Gebruik de juiste categorie, connector en aansluitstandaard, zoals T568A of T568B."}, {"heading": false, "text": "Een standaard Ethernet-koperverbinding is doorgaans maximaal 100 meter."}, {"heading": true, "text": "Glasvezel en draadloos"}, {"heading": false, "text": "Glasvezel gebruikt licht, is ongevoelig voor elektromagnetische storing en ondersteunt grote afstanden."}, {"heading": false, "text": "Singlemode is geschikt voor grotere afstanden; multimode wordt vaak voor kortere afstanden gebruikt."}, {"heading": false, "text": "Draadloos gebruikt radiogolven en biedt mobiliteit, maar is gevoelig voor storing, obstakels en gedeeld gebruik van het medium."}, {"heading": true, "text": "Voorbeeld stap voor stap"}, {"heading": false, "text": "Een kabel heeft een capaciteit van 1 Gbit/s, maar een download haalt 600 Mbit/s."}, {"heading": false, "text": "De eerste waarde is de capaciteit; de tweede is de gemeten throughput."}]}, {"title": "Module 5  Number Systems", "parts": [{"heading": true, "text": "Binair en decimaal"}, {"heading": false, "text": "Computers gebruiken bits: 0 of 1."}, {"heading": false, "text": "Acht bits vormen één byte."}, {"heading": false, "text": "De plaatswaarden in een byte zijn 128, 64, 32, 16, 8, 4, 2 en 1."}, {"heading": false, "text": "Tel de waarden met een 1 op: 11000000₂ = 128 + 64 = 192₁₀."}, {"heading": false, "text": "Om 13 naar binair om te zetten: 8 + 4 + 1 = 00001101₂."}, {"heading": true, "text": "Hexadecimaal"}, {"heading": false, "text": "Hexadecimaal heeft zestien symbolen: 0–9 en A–F, waarbij A = 10 en F = 15."}, {"heading": false, "text": "Eén hexadecimaal cijfer komt overeen met vier bits."}, {"heading": false, "text": "Bijvoorbeeld 1010 1111₂ = AF₁₆."}, {"heading": false, "text": "MAC-adressen en IPv6-adressen worden vaak hexadecimaal geschreven."}, {"heading": true, "text": "Toepassing op adressen"}, {"heading": false, "text": "Een IPv4-adres bestaat uit 32 bits, weergegeven als vier decimale octetten, bijvoorbeeld 192.168.1.10."}, {"heading": false, "text": "Een subnetmasker duidt aan welke bits tot het netwerkdeel behoren."}, {"heading": false, "text": "Vergelijk adres en masker bit voor bit met AND om het netwerkadres te bepalen: 192.168.1.10 met 255.255.255.0 levert 192.168.1.0."}, {"heading": true, "text": "Voorbeeld stap voor stap"}, {"heading": false, "text": "Zet 10101100 om: 128 + 32 + 8 + 4 = 172."}, {"heading": false, "text": "De plaatsen met een 0 tel je niet mee."}, {"heading": false, "text": "Omgekeerd is 10 decimaal gelijk aan 00001010 binair."}]}, {"title": "Module 6  Data Link Layer", "parts": [{"heading": true, "text": "Frames en functies"}, {"heading": false, "text": "De datalinklaag zorgt voor overdracht over één lokale verbinding."}, {"heading": false, "text": "Ze verpakt een pakket in een frame en gebruikt adressen die bij het medium horen."}, {"heading": false, "text": "LLC koppelt de hogere laag aan het medium; MAC regelt onder andere toegang tot het medium en adressering."}, {"heading": true, "text": "Frameopbouw en foutdetectie"}, {"heading": false, "text": "Een frame bevat een header, gegevens en een trailer."}, {"heading": false, "text": "De trailer bevat vaak een Frame Check Sequence (FCS), berekend met CRC."}, {"heading": false, "text": "De ontvanger controleert hiermee of het frame waarschijnlijk beschadigd is."}, {"heading": false, "text": "Een fout frame wordt doorgaans weggegooid; FCS herstelt de fout niet zelf."}, {"heading": true, "text": "Media access control en topologie"}, {"heading": false, "text": "Bij full-duplex kunnen beide kanten tegelijk verzenden en ontvangen; bij half-duplex niet."}, {"heading": false, "text": "Op gedeelde Ethernetmedia werd CSMA/CD gebruikt om botsingen te detecteren."}, {"heading": false, "text": "Draadloze netwerken gebruiken CSMA/CA om botsingen te helpen vermijden."}, {"heading": false, "text": "Een point-to-pointverbinding verbindt twee knooppunten; een gedeelde topologie heeft meerdere deelnemers op hetzelfde medium."}, {"heading": true, "text": "Voorbeeld stap voor stap"}, {"heading": false, "text": "Een pc verstuurt een frame."}, {"heading": false, "text": "Door storing verandert een bit."}, {"heading": false, "text": "De ontvanger controleert de FCS en kan vaststellen dat het frame beschadigd is; hij gooit het weg."}]}, {"title": "Module 7  Ethernet Switching", "parts": [{"heading": true, "text": "Ethernet en MAC-adressen"}, {"heading": false, "text": "Ethernet is een veelgebruikte LAN-technologie op laag 1 en 2."}, {"heading": false, "text": "Een Ethernet-MAC-adres bestaat uit 48 bits en wordt meestal in hexadecimaal weergegeven."}, {"heading": false, "text": "Een frame bevat onder meer bestemmings- en bron-MAC, type of lengte, gegevens en FCS."}, {"heading": false, "text": "Een broadcast-MAC-adres is FF:FF:FF:FF:FF:FF."}, {"heading": true, "text": "Hoe een switch leert"}, {"heading": false, "text": "Een switch leert de bron-MAC van een ontvangen frame en koppelt die aan de inkomende poort in zijn MAC-adrestabel."}, {"heading": false, "text": "Kent hij de bestemming, dan stuurt hij het frame alleen via de juiste poort door."}, {"heading": false, "text": "Bij een onbekende unicast of broadcast wordt het frame geflood naar de andere poorten binnen hetzelfde VLAN."}, {"heading": false, "text": "Oude vermeldingen verlopen na een tijd."}, {"heading": true, "text": "Switchingmethoden en poorten"}, {"heading": false, "text": "Bij store-and-forward ontvangt de switch het hele frame en controleert de FCS vóór doorsturen."}, {"heading": false, "text": "Cut-through kan eerder beginnen en heeft lagere vertraging, maar kan beschadigde frames doorsturen."}, {"heading": false, "text": "Bij auto-negotiation spreken geschikte apparaten snelheid en duplex af."}, {"heading": false, "text": "Full-duplex op een switchpoort voorkomt botsingen op die verbinding."}, {"heading": true, "text": "Voorbeeld stap voor stap"}, {"heading": false, "text": "Pc A zit op poort 1 en pc B op poort 2."}, {"heading": false, "text": "Na ontvangst leert de switch dat A op poort 1 zit."}, {"heading": false, "text": "Zodra hij B kent, stuurt hij frames voor B alleen naar poort 2."}]}, {"title": "Module 8  Network Layer", "parts": [{"heading": true, "text": "De rol van IP"}, {"heading": false, "text": "De netwerklaag levert IP-pakketten van bron naar bestemming over meerdere netwerken."}, {"heading": false, "text": "IP is verbindingsloos en best effort: levering en volgorde zijn niet gegarandeerd."}, {"heading": false, "text": "IPv4 gebruikt 32-bitadressen; IPv6 gebruikt 128-bitadressen."}, {"heading": false, "text": "De IP-header bevat onder meer bron- en bestemmingsadres."}, {"heading": true, "text": "Router en default gateway"}, {"heading": false, "text": "Een host bepaalt met zijn IP-adres en subnetmasker of een bestemming lokaal is."}, {"heading": false, "text": "Is ze lokaal, dan wordt het frame rechtstreeks naar die host gestuurd."}, {"heading": false, "text": "Ligt ze op een ander netwerk, dan gaat het frame naar de default gateway, meestal een router."}, {"heading": false, "text": "Het IP-bestemmingsadres blijft dat van de uiteindelijke bestemming."}, {"heading": true, "text": "Routeringstabel"}, {"heading": false, "text": "Een router kiest een route op basis van het bestemmings-IP-adres en de meest specifieke passende route (longest prefix match)."}, {"heading": false, "text": "Routes kunnen direct verbonden, statisch of dynamisch geleerd zijn."}, {"heading": false, "text": "Een default route wordt gebruikt als er geen specifiekere passende route is."}, {"heading": false, "text": "Als geen bruikbare route bestaat, wordt het pakket niet doorgestuurd."}, {"heading": true, "text": "Headers onderweg"}, {"heading": false, "text": "Een router verwijdert het inkomende frame, bekijkt het IP-pakket en verpakt het opnieuw voor de volgende verbinding."}, {"heading": false, "text": "De MAC-adressen veranderen per hop."}, {"heading": false, "text": "IPv4 TTL of IPv6 Hop Limit wordt bij routering verlaagd om eindeloos rondgaande pakketten te voorkomen."}, {"heading": true, "text": "Voorbeeld stap voor stap"}, {"heading": false, "text": "Pc 192.168.1.10/24 wil naar 192.168.2.10."}, {"heading": false, "text": "De bestemming ligt buiten zijn subnet, dus stuurt de pc het frame naar zijn gateway, bijvoorbeeld 192.168.1.1."}, {"heading": false, "text": "De router kiest vervolgens een route."}]}, {"title": "Module 9  Address Resolution", "parts": [{"heading": true, "text": "IP en MAC samenwerken"}, {"heading": false, "text": "IP-adressen identificeren de uiteindelijke bron en bestemming; MAC-adressen bezorgen frames op de lokale verbinding."}, {"heading": false, "text": "Voor een lokale bestemming zoekt de zender de MAC van de doelhost."}, {"heading": false, "text": "Voor een bestemming buiten het subnet zoekt hij de MAC van de default gateway."}, {"heading": true, "text": "ARP bij IPv4"}, {"heading": false, "text": "Address Resolution Protocol (ARP) koppelt een bekend lokaal IPv4-adres aan een MAC-adres."}, {"heading": false, "text": "Een host verstuurt een ARP request als broadcast: wie heeft dit IPv4-adres?"}, {"heading": false, "text": "De betreffende host antwoordt normaal met een unicast ARP reply met zijn MAC-adres."}, {"heading": false, "text": "De koppeling wordt tijdelijk in een ARP-tabel bewaard."}, {"heading": false, "text": "ARP-broadcasts worden niet door routers doorgestuurd."}, {"heading": true, "text": "IPv6 Neighbor Discovery"}, {"heading": false, "text": "IPv6 gebruikt Neighbor Discovery via ICMPv6 in plaats van ARP."}, {"heading": false, "text": "Een Neighbor Solicitation vraagt naar een buur; een Neighbor Advertisement geeft onder meer diens MAC-adres terug."}, {"heading": false, "text": "De aanvraag gebruikt multicast."}, {"heading": false, "text": "Router Solicitation en Router Advertisement helpen hosts routers en netwerkparameters te ontdekken; Router Advertisements kunnen ook bij SLAAC worden gebruikt."}, {"heading": true, "text": "Beveiliging"}, {"heading": false, "text": "Valse ARP-antwoorden kunnen een verkeerde koppeling veroorzaken en verkeer omleiden."}, {"heading": false, "text": "Beveiliging van het lokale netwerk en passende switchfuncties helpen dergelijke aanvallen beperken."}, {"heading": true, "text": "Voorbeeld stap voor stap"}, {"heading": false, "text": "Pc 192.168.1.10 wil 192.168.1.20 bereiken."}, {"heading": false, "text": "Hij vraagt via ARP wie 192.168.1.20 heeft."}, {"heading": false, "text": "De doel-pc antwoordt met zijn MAC-adres."}, {"heading": false, "text": "Daarna kan de eerste pc het frame versturen."}]}];const app=document.getElementById('app');let mode='theorie', pool=[],i=0,score=0, selected=null,checked=false,wrong=[];

function photoBlock(j){if(!photos[j])return '';return '<div class="photo-grid">'+photos[j].map(x=>'<figure class="photo-card"><img src="'+x[0]+'" alt="'+x[1]+'" loading="lazy"><figcaption>'+x[1]+' · <a href="'+x[2]+'" target="_blank" rel="noopener noreferrer">Bron</a></figcaption></figure>').join('')+'</div>'}
function visual(j){let v=visuals[j];return '<div class="visual-example"><div class="visual-label">VISUEEL VOORBEELD</div><h3>'+v[0]+'</h3>'+(j===3?'<svg viewBox="0 0 600 120" role="img" aria-label="Illustratie van een Ethernetkabel met RJ45-connector"><path d="M10 65 H280" fill="none" stroke="#64d8bf" stroke-width="22" stroke-linecap="round"/><path d="M280 51 H355 V79 H280" fill="#70a4df"/><path d="M350 36 H485 L520 51 V82 L485 96 H350 Z" fill="#dcecff" stroke="#88b4df" stroke-width="4"/><path d="M375 38 V57 M390 38 V57 M405 38 V57 M420 38 V57 M435 38 V57 M450 38 V57 M465 38 V57 M480 38 V57" stroke="#dfb561" stroke-width="6"/><path d="M385 96 L400 111 H468 L480 96" fill="none" stroke="#b3d7ff" stroke-width="5"/><text x="25" y="105" fill="#d1e5f9" font-size="16">Ethernetkabel</text><text x="365" y="22" fill="#d1e5f9" font-size="16">RJ45-connector</text></svg><p>Een Ethernetkabel verbindt bijvoorbeeld een pc met een switch. Binnenin zitten getwiste draadparen. De RJ45-connector past in een Ethernetpoort.</p>':'<div class="visual-flow">'+v.slice(1).map((x,k)=>'<span>'+x+'</span>'+(k<3?'<b aria-hidden="true">→</b>':'')).join('')+'</div>')+'</div>'}
let studyModule=0,studyTopic=0;
function theory(){let m=modules[studyModule],groups=[],cur=null;m.parts.forEach(p=>{if(p.heading){cur={title:p.text,items:[]};groups.push(cur)}else if(cur)cur.items.push(p.text)});if(studyTopic>=groups.length)studyTopic=0;let g=groups[studyTopic];app.innerHTML='<div class="card"><span class="tag">STUDIEGIDS</span><h2>Begrijp het, stap voor stap</h2><p>Kies links een module en bekijk telkens één onderwerp. Gebruik de pijlen om verder te gaan.</p></div><div class="study-layout"><aside class="study-menu">'+modules.map((x,j)=>'<button data-mod="'+j+'" class="'+(j===studyModule?'current':'')+'">'+esc(x.title)+'</button>').join('')+'</aside><section class="card"><span class="tag">MODULE '+(studyModule+1)+'</span><h2>'+esc(m.title.replace(/^Module [0-9]+\s+/,''))+'</h2><div class="topic-tabs">'+groups.map((x,j)=>'<button data-topic="'+j+'" class="'+(j===studyTopic?'current':'')+'">'+esc(x.title)+'</button>').join('')+'</div><div class="topic-body"><span class="study-count">ONDERWERP '+(studyTopic+1)+' VAN '+groups.length+'</span><h3>'+esc(g.title)+'</h3>'+g.items.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>'+(studyTopic===0?visual(studyModule)+photoBlock(studyModule):'')+'<div class="study-actions"><button id="prev" '+(studyTopic===0?'disabled':'')+'>← Vorige</button><button class="action" id="next-topic">'+(studyTopic===groups.length-1?'Oefen deze module →':'Volgend onderwerp →')+'</button></div></section></div>';document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{studyModule=+b.dataset.mod;studyTopic=0;theory()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{studyTopic=+b.dataset.topic;theory()});document.getElementById('prev').onclick=()=>{studyTopic--;theory()};document.getElementById('next-topic').onclick=()=>{if(studyTopic<groups.length-1){studyTopic++;theory()}else{let n=studyModule+1;nav('oefenen');document.getElementById('filter').value=n;document.getElementById('start').click()}}}
function startScreen(){app.innerHTML=mode==='oefenen'?'<div class="card"><span class="tag">OEFENHOEK</span><h2>Oefen op jouw tempo</h2><p>Kies een module of oefen alle onderwerpen. Je krijgt meteen het juiste antwoord en een uitleg.</p><label>Onderwerp <select id="filter"><option value="all">Alle modules</option>'+modules.map((m,j)=>'<option value="'+(j+1)+'">'+esc(m.title)+'</option>').join('')+'</select></label> <button class="action" id="start">Start oefenen</button></div>':'<div class="card"><span class="tag">EXAMENHOEK</span><h2>Proefexamen</h2><p>Beantwoord 50 vragen zonder onmiddellijke feedback. Na afloop zie je je score en uitleg bij je fouten.</p><button class="action" id="start">Start examen</button></div>';document.getElementById('start').onclick=()=>{let f=document.getElementById('filter');pool=shuffle(questions.filter(q=>!f||f.value==='all'||q[0]===f.value));i=0;score=0;wrong=[];selected=null;checked=false;render()}}
function render(){if(i>=pool.length){app.innerHTML='<div class="card"><span class="tag">AFGEROND</span><h2>Je score: '+score+' / '+pool.length+'</h2><p>'+Math.round(score/pool.length*100)+'% juist. Bekijk je fouten hieronder en herhaal de bijbehorende theorie.</p><button class="action" id="again">Opnieuw beginnen</button></div>'+wrong.map(q=>'<div class="card"><strong>Module '+q[0]+' · '+esc(q[1])+'</strong><p>Jouw antwoord: '+esc(q.chosen)+'</p><p><b>Juiste antwoord: '+esc(q[2][q[3]])+'</b></p><p>'+esc(q[4])+'</p></div>').join('');document.getElementById('again').onclick=startScreen;return}let q=pool[i];app.innerHTML='<div class="card"><div class="tag">'+(mode==='examen'?'PROEFEXAMEN':'OEFENEN')+' · MODULE '+q[0]+'</div><p class="muted">Vraag '+(i+1)+' van '+pool.length+'</p><progress max="'+pool.length+'" value="'+i+'"></progress><h2>'+esc(q[1])+'</h2><div class="choices">'+q[2].map((v,n)=>'<button data-n="'+n+'">'+String.fromCharCode(65+n)+'. '+esc(v)+'</button>').join('')+'</div><div id="feedback"></div><button class="action" id="submit" disabled>Bevestig antwoord</button></div>';document.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>{if(checked)return;selected=+b.dataset.n;document.querySelectorAll('.choices button').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('submit').disabled=false});document.getElementById('submit').onclick=()=>{if(!checked){checked=true;if(selected===q[3])score++;else wrong.push(Object.assign([...q],{chosen:q[2][selected]}));if(mode==='oefenen')document.getElementById('feedback').innerHTML='<div class="feedback"><strong>'+(selected===q[3]?'Goed gedaan!':'Niet juist. Juiste antwoord: '+esc(q[2][q[3]]))+'</strong><p>'+esc(q[4])+'</p></div>';document.getElementById('submit').textContent=i===pool.length-1?'Bekijk resultaat':'Volgende vraag →'}else{i++;selected=null;checked=false;render()}}}nav('theorie');
</script></body></html>
